<!DOCTYPE html>
<html>
<head>
    <title>Test Leaflet Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { 
            height: 400px; 
            width: 100%;
            border: 2px solid #ccc;
            margin: 20px 0;
        }
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .test-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🗺️ Test Leaflet Map</h1>
    <p>Đây là test đơn giản để kiểm tra Leaflet map hoạt động:</p>
    
    <button class="test-btn" onclick="testMap()">🔄 Khởi tạo Map</button>
    <button class="test-btn" onclick="testLocation()">📍 Test với Google DNS (8.8.8.8)</button>
    
    <div id="map"></div>
    
    <div id="status" style="margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 5px;">
        <strong>Status:</strong> Chưa khởi tạo map
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let marker;
        
        function updateStatus(message) {
            document.getElementById('status').innerHTML = '<strong>Status:</strong> ' + message;
        }
        
        function testMap() {
            try {
                updateStatus('Đang khởi tạo map...');
                
                // Clear existing map
                if (map) {
                    map.remove();
                }
                
                // Create map
                map = L.map('map').setView([16.0583, 108.2772], 6);
                
                // Add tiles
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);
                
                updateStatus('✅ Map khởi tạo thành công!');
                
            } catch (error) {
                updateStatus('❌ Lỗi khởi tạo map: ' + error.message);
                console.error(error);
            }
        }
        
        function testLocation() {
            if (!map) {
                updateStatus('❌ Vui lòng khởi tạo map trước');
                return;
            }
            
            try {
                updateStatus('Đang hiển thị vị trí Google DNS...');
                
                // Google DNS location (Mountain View, CA)
                const location = [37.4056, -122.0775];
                
                // Remove existing marker
                if (marker) {
                    map.removeLayer(marker);
                }
                
                // Center map
                map.setView(location, 10);
                
                // Add marker
                marker = L.marker(location).addTo(map);
                
                // Add popup
                marker.bindPopup(`
                    <div style="padding: 10px;">
                        <h4>📍 Google DNS (8.8.8.8)</h4>
                        <p><strong>Location:</strong> Mountain View, CA</p>
                        <p><strong>Coordinates:</strong> 37.4056, -122.0775</p>
                    </div>
                `).openPopup();
                
                updateStatus('✅ Hiển thị vị trí thành công!');
                
            } catch (error) {
                updateStatus('❌ Lỗi hiển thị vị trí: ' + error.message);
                console.error(error);
            }
        }
        
        // Auto test when page loads
        window.onload = function() {
            setTimeout(testMap, 1000);
        };
    </script>
</body>
</html>
