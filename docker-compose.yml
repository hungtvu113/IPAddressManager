version: '3.8'

services:
  ip-manager:
    build: .
    container_name: ip-address-manager
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - ip-manager-network

networks:
  ip-manager-network:
    driver: bridge
